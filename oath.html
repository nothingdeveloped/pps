<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oath Privacy Policy</title>
<meta name="description" content="How Oath collects, uses and protects your information. Oath is an accountability app by Silicon.">
<style>
  :root{
    --ground:#0F0E0C; --surface:#1A1916; --line:#2E2C27; --bone:#EDE7DC; --ash:#A39D91; --ember:#FF5A1F;
  }
  @media (prefers-color-scheme: light){
    :root{ --ground:#FAF9F5; --surface:#FFFFFF; --line:#E4DFD3; --bone:#141413; --ash:#5F5A50; --ember:#D63F00; }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ground);color:var(--bone);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:720px;margin:0 auto;padding:40px 20px 72px}
  .eyebrow{font:500 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
  h1{margin:14px 0 8px;font-size:clamp(30px,6vw,44px);line-height:1.05;letter-spacing:-.01em}
  h2{margin:44px 0 10px;font-size:21px;line-height:1.25;scroll-margin-top:16px}
  h3{margin:22px 0 6px;font-size:16px;color:var(--bone)}
  p{margin:0 0 14px;color:var(--ash)}
  p strong,li strong,td strong{color:var(--bone)}
  .lead{font-size:18px}
  .card{background:var(--surface);border:1px solid var(--line);padding:18px 20px;margin:14px 0}
  .card p:last-child{margin-bottom:0}
  ul,ol{margin:0 0 14px;padding-left:22px;color:var(--ash)}
  li{margin:6px 0}
  a{color:var(--ember)}
  table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:15px}
  th,td{text-align:left;vertical-align:top;padding:10px 12px;border-top:1px solid var(--line)}
